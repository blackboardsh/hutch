name: Resume Hutch release publication

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag whose publication failed (for example v0.29.0)
        type: string
        required: true
      build_run_id:
        description: Original release.yml tag-push run with all six successful builds
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  publish:
    name: Resume verified release artifacts
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: hutch-r2-publish
      cancel-in-progress: false
    steps:
      - name: Check out repaired publication tooling from the dispatch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false

      - name: Test recovery guards and publisher
        run: node --test tooling/scripts/resume-release-publication.test.js tooling/scripts/upload-release-r2.test.js

      - name: Check out immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source run, tag, successful matrix, and artifact provenance
        id: source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          RELEASE_SOURCE_DIR: release-source
          GITHUB_TOKEN: ${{ github.token }}
        run: node tooling/scripts/resume-release-publication.js

      - name: Download exactly the verified build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_ids }}
          run-id: ${{ steps.source.outputs.build_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: release-source/release
          merge-multiple: true

      - name: Apply repaired publisher to original release source
        # Keep the tagged version, release contract, settings, and installers.
        run: cp tooling/scripts/upload-release-r2.js release-source/scripts/upload-release-r2.js

      - name: Validate the complete publication plan without credentials
        working-directory: release-source
        env:
          RELEASE_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          RELEASE_SOURCE_TAG: ${{ steps.source.outputs.release_tag }}
        run: >-
          env GITHUB_SHA="$RELEASE_SOURCE_SHA"
          GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$RELEASE_SOURCE_TAG"
          node scripts/upload-release-r2.js --all --dry-run

      - name: Resume immutable uploads and publish channel last
        working-directory: release-source
        env:
          RELEASE_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          RELEASE_SOURCE_TAG: ${{ steps.source.outputs.release_tag }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: >-
          env GITHUB_SHA="$RELEASE_SOURCE_SHA"
          GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$RELEASE_SOURCE_TAG"
          node scripts/upload-release-r2.js --all
